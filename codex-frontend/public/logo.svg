<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="cdxLogoBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Top Layer (Reasoning & Agent Engine) -->
    <linearGradient id="logoTopPlate" x1="30" y1="24" x2="98" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    
    <!-- Middle Layer (Retrieval & Vector State) -->
    <linearGradient id="logoMidPlate" x1="30" y1="48" x2="98" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Bottom Layer (Storage & Persistent Artifacts) -->
    <linearGradient id="logoBotPlate" x1="30" y1="72" x2="98" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Outer Frame Glow Border -->
    <linearGradient id="logoBorderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="logoAmbientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#cdxLogoBg)" stroke="url(#logoBorderGrad)" stroke-width="4"/>

  <!-- Ambient Glow -->
  <circle cx="64" cy="54" r="48" fill="url(#logoAmbientGlow)"/>

  <!-- Layer 3: Storage & Artifact Foundation -->
  <path d="M64 72L98 90L64 108L30 90L64 72Z" fill="url(#logoBotPlate)" fill-opacity="0.4" stroke="url(#logoBotPlate)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Layer 2: Hybrid Retrieval & Memory Pipeline -->
  <path d="M64 48L98 66L64 84L30 66L64 48Z" fill="url(#logoMidPlate)" fill-opacity="0.6" stroke="url(#logoMidPlate)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Layer 1: Autonomous Cognitive Agent Engine -->
  <path d="M64 24L98 42L64 60L30 42L64 24Z" fill="url(#logoTopPlate)" stroke="#BAE6FD" stroke-width="4" stroke-linejoin="round"/>

  <!-- Center Nexus Core -->
  <circle cx="64" cy="42" r="6" fill="#FFFFFF"/>
</svg>
