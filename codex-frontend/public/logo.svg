<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="cdxHiBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="cdxHiCyan" x1="32" y1="32" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="cdxHiBorder" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="cdxHiRadialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="cdxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- High-Res Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#cdxHiBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="32" stroke="url(#cdxHiBorder)" stroke-width="4"/>

  <!-- Core Ambient Glow -->
  <circle cx="64" cy="64" r="44" fill="url(#cdxHiRadialGlow)"/>

  <!-- Layered Codex Document Plate -->
  <path d="M30 38C30 33.58 33.58 30 38 30H76L98 52V90C98 94.42 94.42 98 90 98H38C33.58 98 30 94.42 30 90V38Z" 
        fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="4" stroke-linejoin="round"/>

  <!-- Fold Notch -->
  <path d="M76 30V48C76 50.2 77.8 52 80 52H98" 
        stroke="#38BDF8" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Autonomous Agent Terminal Prompt: `>` -->
  <path d="M46 52L62 66L46 80" 
        stroke="url(#cdxHiCyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cdxGlow)"/>

  <!-- Execution Block Cursor: `_` -->
  <line x1="70" y1="80" x2="84" y2="80" 
        stroke="url(#cdxHiCyan)" stroke-width="8" stroke-linecap="round" filter="url(#cdxGlow)"/>

  <!-- Active Pulse Core -->
  <circle cx="72" cy="52" r="6" fill="#38BDF8" filter="url(#cdxGlow)"/>
</svg>
