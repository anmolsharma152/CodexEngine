<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="appleBg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="appleCyan" x1="45" y1="45" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="appleBorder" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="appleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Apple Touch Frame -->
  <rect width="180" height="180" rx="40" fill="url(#appleBg)"/>
  <rect x="2" y="2" width="176" height="176" rx="38" stroke="url(#appleBorder)" stroke-width="4"/>

  <!-- Core Ambient Glow -->
  <circle cx="90" cy="90" r="60" fill="url(#appleGlow)"/>

  <!-- Layered Codex Document Plate -->
  <path d="M42 54C42 47.37 47.37 42 54 42H106L138 74V126C138 132.63 132.63 138 126 138H54C47.37 138 42 132.63 42 126V54Z" 
        fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="5" stroke-linejoin="round"/>

  <!-- Fold Notch -->
  <path d="M106 42V68C106 71.3 108.7 74 112 74H138" 
        stroke="#38BDF8" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Autonomous Agent Terminal Prompt: `>` -->
  <path d="M64 73L87 93L64 113" 
        stroke="url(#appleCyan)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Execution Block Cursor: `_` -->
  <line x1="99" y1="113" x2="119" y2="113" 
        stroke="url(#appleCyan)" stroke-width="11" stroke-linecap="round"/>

  <!-- Active Pulse Core -->
  <circle cx="102" cy="73" r="8" fill="#38BDF8"/>
</svg>
