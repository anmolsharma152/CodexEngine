<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="cdxBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Top Layer (Reasoning & Agent Engine) -->
    <linearGradient id="topPlate" x1="7.5" y1="6" x2="24.5" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    
    <!-- Middle Layer (Retrieval & Vector State) -->
    <linearGradient id="midPlate" x1="7.5" y1="12" x2="24.5" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Bottom Layer (Storage & Persistent Artifacts) -->
    <linearGradient id="botPlate" x1="7.5" y1="18" x2="24.5" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Outer Frame Glow Border -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#cdxBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Layer 3: Storage & Artifact Foundation -->
  <path d="M16 18L24.5 22.5L16 27L7.5 22.5L16 18Z" fill="url(#botPlate)" fill-opacity="0.4" stroke="url(#botPlate)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Layer 2: Hybrid Retrieval & Memory Pipeline -->
  <path d="M16 12L24.5 16.5L16 21L7.5 16.5L16 12Z" fill="url(#midPlate)" fill-opacity="0.6" stroke="url(#midPlate)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Layer 1: Autonomous Cognitive Agent Engine -->
  <path d="M16 6L24.5 10.5L16 15L7.5 10.5L16 6Z" fill="url(#topPlate)" stroke="#BAE6FD" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Center Nexus Core -->
  <circle cx="16" cy="10.5" r="1.5" fill="#FFFFFF"/>
</svg>
